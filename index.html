<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>فارق AI - المنظومة الذكية لتسويق وإعلانات المشاريع</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
    .gold-btn {
      background: #fbbf24;
      color: #000000;
      font-weight: 800;
    }
    .gold-btn:active { transform: scale(0.98); }
    .opt-card { transition: all 0.2s ease; }
    .opt-card:active { transform: scale(0.98); }
    .pay-tab.active {
      border-color: #fbbf24;
      background: rgba(251, 191, 36, 0.12);
      color: #fbbf24;
    }
  </style>
</head>
<body class="bg-[#0b0c10] text-slate-100 min-h-screen flex flex-col justify-between selection:bg-amber-400 selection:text-black">

  <!-- Header -->
  <header class="w-full max-w-md mx-auto pt-4 px-4 flex items-center justify-between text-xs text-slate-400 shrink-0">
    <button onclick="prevStep()" id="backBtn" class="w-8 h-8 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-slate-300 opacity-0 pointer-events-none transition">
      ➜
    </button>
    <div class="flex items-center gap-1.5 font-black text-amber-400 text-lg">
      <span>✨</span>
      <span>فارق</span>
    </div>
    <div class="text-[11px] font-mono text-slate-500" id="stepCounter">1 / 18</div>
  </header>

  <!-- Main Funnel Viewport -->
  <main class="w-full max-w-md mx-auto px-4 my-auto py-3 flex-1 flex flex-col justify-center">
    <div id="stepContainer" class="w-full"></div>
  </main>

  <footer class="w-full max-w-md mx-auto py-3 text-center text-[10px] text-slate-600 shrink-0">
    منظومة فارق AI &copy; 2026 • الذكاء الاصطناعي لمضاعفة مبيعاتك
  </footer>

  <!-- Modal / Checkout Drawer (Visa + Crypto BEP20) -->
  <div id="checkoutModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4 animate-fadeIn">
    <div class="w-full max-w-md bg-[#0f121d] border border-slate-800 rounded-t-[2.5rem] sm:rounded-3xl p-5 text-right shadow-2xl max-h-[92vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
        <div>
          <span class="text-[10px] text-amber-400 font-bold block">إتمام الاشتراك والبدء الفوري</span>
          <h3 class="text-sm font-black text-white" id="checkoutPlanTitle">تجربة 3 أيام بـ $3 فقط</h3>
        </div>
        <button onclick="closeCheckout()" class="w-7 h-7 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center text-xs hover:text-white">✕</button>
      </div>

      <!-- Payment Tabs -->
      <div class="grid grid-cols-2 gap-2 mb-4">
        <button onclick="switchPayMethod('crypto')" id="tabCrypto" class="pay-tab active border-2 border-slate-700 bg-slate-900 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5">
          <span>USDT (BEP20)</span>
          <span>⚡</span>
        </button>
        <button onclick="switchPayMethod('card')" id="tabCard" class="pay-tab border-2 border-slate-700 bg-slate-900 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 text-slate-400">
          <span>بطاقة بنكية / Visa</span>
          <span>💳</span>
        </button>
      </div>

      <!-- Crypto (USDT BEP20) Box -->
      <div id="cryptoPaymentBox" class="space-y-3 mb-4">
        <div class="bg-slate-950 border border-amber-400/30 rounded-2xl p-3.5 text-center">
          <span class="text-[10px] text-slate-400 block mb-1">شبكة التحويل: <b>BNB Smart Chain (BEP20)</b></span>
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-2.5 flex items-center justify-between gap-2 mb-2">
            <span class="text-[10px] text-amber-400 font-mono truncate select-all" id="bep20AddressText">0x71C...BEP20WalletAddress</span>
            <button onclick="copyAddress()" class="shrink-0 bg-amber-400 hover:bg-amber-300 text-black text-[10px] font-black px-2.5 py-1 rounded transition">نسخ 📋</button>
          </div>
          <div class="text-[10px] text-emerald-400 font-bold">
            المبلغ المطلوب: <span id="cryptoAmountDue" class="font-mono text-white text-xs font-black">3.00 USDT</span>
          </div>
        </div>

        <div>
          <label class="block text-[10px] font-bold text-slate-300 mb-1">معرّف المعاملة (TxID / Hash) أو عنوان محفظتك:</label>
          <input type="text" id="cryptoTxInput" placeholder="الصق الـ Hash هنا لتأكيد تفعيل الحساب..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs font-mono text-amber-300 focus:outline-none focus:border-amber-400">
        </div>
      </div>

      <!-- Card (Visa) Box -->
      <div id="cardPaymentBox" class="hidden space-y-3 mb-4">
        <div>
          <label class="block text-[10px] font-bold text-slate-300 mb-1">رقم البطاقة (Visa / Mastercard):</label>
          <input type="text" id="cardNumberInput" placeholder="4000 1234 5678 9010" maxlength="19" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs font-mono text-white focus:outline-none focus:border-amber-400">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[10px] font-bold text-slate-300 mb-1">تاريخ الانتهاء (MM/YY):</label>
            <input type="text" placeholder="12/28" maxlength="5" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs font-mono text-white focus:outline-none focus:border-amber-400">
          </div>
          <div>
            <label class="block text-[10px] font-bold text-slate-300 mb-1">رمز الأمان (CVV):</label>
            <input type="password" placeholder="•••" maxlength="4" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs font-mono text-white focus:outline-none focus:border-amber-400">
          </div>
        </div>
      </div>

      <!-- Action Button -->
      <button onclick="submitOrderPayment()" id="confirmPayBtn" class="w-full gold-btn py-3.5 rounded-xl text-xs transition flex items-center justify-center gap-2 shadow-lg shadow-amber-400/20 mb-2">
        <span>تأكيد الدفع وتفعيل خطة الـ 150 طلباً فوراً ➜</span>
      </button>
      <span class="text-[9px] text-slate-500 block text-center">دفع آمن ومشفّر • يتم تسجيل طلبك في لوحة الإدارة تلقائياً</span>
    </div>
  </div>

            <div class="bg-slate-950 border border-slate-800 rounded-2xl p-3.5 mb-4">
              <span class="text-[9px] bg-amber-400/20 text-amber-300 border border-amber-400/30 px-2 py-0.5 rounded font-bold inline-block mb-1">خطتك جاهزة</span>
              <h4 class="text-xs font-black text-white mb-2 leading-relaxed">خطتك للوصول إلى ${answers.monthlyTarget} من الطلبات شهرياً خلال ${answers.timeframe}</h4>
              <ul class="text-[10px] text-slate-300 space-y-1.5 pr-1">
                <li class="flex items-center gap-1.5"><span class="text-amber-400 font-black">✓</span> أول إعلاناتك لمجالك خلال عشرات دقائق من البدء</li>
                <li class="flex items-center gap-1.5"><span class="text-amber-400 font-black">✓</span> فيديو بأسلوب البودكاست بالعربية</li>
                <li class="flex items-center gap-1.5"><span class="text-amber-400 font-black">✓</span> تصاميم جاهزة لكل حملة معمولة</li>
              </ul>
            </div>

            <!-- CTA Button matching 00:55 of the video -->
            <button onclick="openCheckoutModal()" class="w-full gold-btn py-4 rounded-xl text-xs transition flex items-center justify-center gap-2 shadow-lg shadow-amber-400/25 mb-1.5">
              <span>جرب 3 أيام بـ $3 فقط ➜</span>
            </button>
            <span class="text-[9px] text-slate-400 block text-center font-medium">ثم $27 شهرياً بعد 3 أيام — يمكنك الإلغاء في أي وقت قبل التجديد</span>
          </div>
        `
      }
    ];

    function renderCurrentStep() {
      const step = steps[currentStepIndex];
      const container = document.getElementById('stepContainer');
      const backBtn = document.getElementById('backBtn');
      const counter = document.getElementById('stepCounter');

      counter.innerText = `${currentStepIndex + 1} / ${steps.length}`;

      if (currentStepIndex > 0 && currentStepIndex !== 9 && currentStepIndex !== 10) {
        backBtn.classList.remove('opacity-0', 'pointer-events-none');
      } else {
        backBtn.classList.add('opacity-0', 'pointer-events-none');
      }

      if (step.render) {
        container.innerHTML = step.render();
      } else if (step.type === 'select') {
        let opts = '';
        step.options.forEach(opt => {
          opts += `
            <div onclick="selectOption('${opt.key}', '${opt.text}')" class="opt-card flex items-center justify-between p-3.5 bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-2xl cursor-pointer">
              <div class="flex items-center gap-3">
                <span class="text-xl">${opt.icon}</span>
                <span class="text-xs font-bold text-white">${opt.text}</span>
              </div>
              <div class="w-5 h-5 rounded-full border border-slate-700 flex items-center justify-center">
                <div class="w-2.5 h-2.5 rounded-full bg-transparent"></div>
              </div>
            </div>
          `;
        });
        container.innerHTML = `
          <div class="animate-fadeIn">
            <h2 class="text-lg font-black text-white text-center mb-5">${step.question}</h2>
            <div class="space-y-2.5 mb-6">${opts}</div>
          </div>
        `;
      } else if (step.type === 'grid_select') {
        let opts = '';
        step.options.forEach(opt => {
          opts += `
            <div onclick="selectOption('${opt.key}', '${opt.text}')" class="opt-card p-4 bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-2xl cursor-pointer text-center flex flex-col items-center justify-center gap-2">
              <span class="text-3xl block">${opt.icon}</span>
              <span class="text-xs font-bold text-white block">${opt.text}</span>
            </div>
          `;
        });
        container.innerHTML = `
          <div class="animate-fadeIn text-center">
            <h2 class="text-lg font-black text-white mb-1">${step.question}</h2>
            <p class="text-xs text-slate-400 mb-5">${step.subtext || ''}</p>
            <div class="grid grid-cols-2 gap-3 mb-6">${opts}</div>
          </div>
        `;
      }
    }

    function selectOption(key, val) {
      answers[key] = val;
      nextStep();
    }

    function updateSlider(val) {
      answers.monthlyTarget = val;
      document.getElementById('sliderValDisplay').innerText = val;
    }

    function nextStep() {
      if (currentStepIndex < steps.length - 1) {
        currentStepIndex++;
        renderCurrentStep();
      }
    }

    function prevStep() {
      if (currentStepIndex > 0) {
        currentStepIndex--;
        renderCurrentStep();
      }
    }

    function startFunnelLoading() {
      currentStepIndex = 9; // Loader
      renderCurrentStep();

      let progress = 13;
      const progressCircle = document.getElementById('progressCircle');
      const loadPercent = document.getElementById('loadPercent');
      const check2 = document.getElementById('stepCheck2');
      const check3 = document.getElementById('stepCheck3');

      const interval = setInterval(() => {
        progress += Math.floor(Math.random() * 18) + 14;
        if (progress > 100) progress = 100;

        loadPercent.innerText = progress + '%';
        const offset = 390 - (390 * progress) / 100;
        progressCircle.style.strokeDashoffset = offset;

        if (progress >= 50 && check2) {
          check2.className = 'flex items-center gap-2 text-amber-300';
          check2.innerHTML = '<span class="w-4 h-4 rounded-full bg-amber-400 text-black flex items-center justify-center text-[10px] font-bold">✓</span><span>نختار الصيغ الأكثر مبيعاً</span>';
        }
        if (progress >= 85 && check3) {
          check3.className = 'flex items-center gap-2 text-amber-300';
          check3.innerHTML = '<span class="w-4 h-4 rounded-full bg-amber-400 text-black flex items-center justify-center text-[10px] font-bold">✓</span><span>نجهّز الفيديوهات والنصوص التسويقية</span>';
        }

        if (progress >= 100) {
          clearInterval(interval);
          setTimeout(() => {
            currentStepIndex = 10; // Final 3aqel Results page
            renderCurrentStep();
          }, 500);
        }
      }, 400);
    }

    // Checkout modal functions
    function openCheckoutModal() {
      document.getElementById('checkoutModal').classList.remove('hidden');
    }

    function closeCheckout() {
      document.getElementById('checkoutModal').classList.add('hidden');
    }

    function switchPayMethod(method) {
      answers.payMethod = method;
      const tabC = document.getElementById('tabCrypto');
      const tabK = document.getElementById('tabCard');
      const boxC = document.getElementById('cryptoPaymentBox');
      const boxK = document.getElementById('cardPaymentBox');

      if (method === 'crypto') {
        tabC.className = 'pay-tab active border-2 border-amber-400 bg-amber-400/15 text-amber-400 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5';
        tabK.className = 'pay-tab border-2 border-slate-700 bg-slate-900 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 text-slate-400';
        boxC.classList.remove('hidden');
        boxK.classList.add('hidden');
      } else {
        tabK.className = 'pay-tab active border-2 border-amber-400 bg-amber-400/15 text-amber-400 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5';
        tabC.className = 'pay-tab border-2 border-slate-700 bg-slate-900 py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 text-slate-400';
        boxK.classList.remove('hidden');
        boxC.classList.add('hidden');
      }
    }

    function copyAddress() {
      const addr = document.getElementById('bep20AddressText').innerText;
      navigator.clipboard.writeText(addr);
      alert('تم نسخ عنوان BEP20 بنجاح: ' + addr);
    }

    async function submitOrderPayment() {
      const btn = document.getElementById('confirmPayBtn');
      btn.disabled = true;
      btn.innerText = 'جاري التحقق وتأكيد المعاملة في السيرفر...';

      const payload = {
        plan: 'trial_3d',
        price: answers.chosenPrice,
        currency: answers.payMethod === 'crypto' ? 'USDT' : 'USD',
        method: answers.payMethod,
        industry: answers.industry,
        monthlyTarget: answers.monthlyTarget,
        txRef: answers.payMethod === 'crypto' ? (document.getElementById('cryptoTxInput').value.trim() || 'BEP20_PENDING') : 'CARD_SUCCESS'
      };

      try {
        const resp = await fetch('/api/orders/create', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await resp.json();

        closeCheckout();
        alert(`مبروك! تم تفعيل خطتك التسويقية لمجال (${answers.industry}). رقم اشتراكك: ${data.orderId || 'FAREQ-01'}. سيتم توجيهك الآن للاستوديو.`);
        window.location.href = '/studio';
      } catch (err) {
        closeCheckout();
        alert(`تم استلام طلبك وتأكيد العملية بنجاح! سيتم المتابعة والتفعيل فوراً.`);
      }
    }

    renderCurrentStep();
  </script>
</body>
</html>
