<!DOCTYPE html>

    body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
    .gold-gradient {
      background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);
    }
    .gold-btn {
      background: #fbbf24;
      color: #000000;
      font-weight: 800;
    }
    .gold-btn:active {
      transform: scale(0.98);
    }
    .opt-card {
      transition: all 0.2s ease;
    }
    .opt-card:active {
      transform: scale(0.98);
    }
    .opt-card.selected {
      border-color: #fbbf24 !important;
      background: rgba(251, 191, 36, 0.12) !important;
    }
  </style>
</head>

      },

      // 13: Final Deliverable Showcase (The 3aqel Results Page)
      {
        type: 'final_showcase',
        render: () => `
          <div class="text-center animate-fadeIn bg-slate-900 border border-slate-800 rounded-3xl p-5 shadow-2xl">
            <div class="flex items-center justify-between mb-3 text-right">
              <div>
                <h3 class="text-sm font-black text-white">فيديوهاتك وإعلاناتك الأولى</h3>
                <span class="text-[10px] text-amber-400 font-bold">لمجال: ${answers.industry}</span>
              </div>
              <span class="text-[10px] bg-amber-400 text-black px-2.5 py-1 rounded-full font-black">جاهزة للنشر 🚀</span>
            </div>

            <!-- Video cards grid -->
            <div class="grid grid-cols-2 gap-2.5 mb-5">
              
              <div class="relative aspect-[9/14] rounded-2xl overflow-hidden bg-slate-950 border border-slate-800 shadow flex flex-col justify-between p-3 text-right">
                <span class="text-[10px] bg-black/60 text-white px-2 py-0.5 rounded backdrop-blur self-start font-bold">فيديو 1</span>
                <div class="my-auto text-center">
                  <div class="w-10 h-10 mx-auto rounded-full bg-amber-400 text-black flex items-center justify-center text-lg shadow-lg font-black cursor-pointer hover:scale-110 transition">▶</div>
                </div>
                <div>
                  <span class="text-[11px] font-black text-white block">إعلان الموديل والعرض</span>
                  <span class="text-[9px] text-slate-400 block">صوت بشري + خصم 35%</span>
                </div>
              </div>

              <div class="relative aspect-[9/14] rounded-2xl overflow-hidden bg-slate-950 border border-slate-800 shadow flex flex-col justify-between p-3 text-right">
                <span class="text-[10px] bg-black/60 text-white px-2 py-0.5 rounded backdrop-blur self-start font-bold">فيديو 2</span>
                <div class="my-auto text-center">
                  <div class="w-10 h-10 mx-auto rounded-full bg-amber-400 text-black flex items-center justify-center text-lg shadow-lg font-black cursor-pointer hover:scale-110 transition">▶</div>
                </div>
                <div>
                  <span class="text-[11px] font-black text-white block">ريلز المشكلة والحل</span>
                  <span class="text-[9px] text-slate-400 block">إيقاع حماسي تيك توك</span>
                </div>
              </div>

            </div>

            <!-- Strategy Card -->
            <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 text-right mb-5">
              <div class="text-xs font-black text-amber-400 mb-1.5 flex items-center gap-1.5">
                <span>🎯</span>
                <span>خطتك للوصول إلى ${answers.monthlyTarget} طلب شهرياً:</span>
              </div>
              <ul class="text-[11px] text-slate-300 space-y-1.5 font-medium pr-1">

    function renderCurrentStep() {
      const step = steps[currentStepIndex];
      const container = document.getElementById('stepContainer');
      const backBtn = document.getElementById('backBtn');
      const counter = document.getElementById('stepCounter');

      counter.innerText = `${currentStepIndex + 1} / ${steps.length}`;

      if (currentStepIndex > 0) {
        backBtn.classList.remove('opacity-0', 'pointer-events-none');
      } else {
        backBtn.classList.add('opacity-0', 'pointer-events-none');
      }

      if (step.render) {
        container.innerHTML = step.render();
      } else if (step.type === 'select') {
        let opts = '';
        step.options.forEach((opt, idx) => {
          opts += `
            <div onclick="selectOption('${opt.key}', '${opt.text}')" class="opt-card flex items-center justify-between p-4 bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-2xl cursor-pointer">
              <div class="flex items-center gap-3">
                <span class="text-xl">${opt.icon}</span>
                <span class="text-xs font-bold text-white">${opt.text}</span>
              </div>
              <div class="w-5 h-5 rounded-full border border-slate-700 flex items-center justify-center text-[10px]">
                <div class="w-2.5 h-2.5 rounded-full bg-transparent"></div>
              </div>
            </div>
          `;
        });

        container.innerHTML = `
          <div class="animate-fadeIn">
            <h2 class="text-xl font-black text-white text-center mb-6">${step.question}</h2>
            <div class="space-y-2.5 mb-6">${opts}</div>
          </div>
        `;
      } else if (step.type === 'grid_select') {
        let opts = '';
        step.options.forEach(opt => {
          opts += `
            <div onclick="selectOption('${opt.key}', '${opt.text}')" class="opt-card p-4 bg-slate-900 border border-slate-800 hover:border-slate-700 rounded-2xl cursor-pointer text-center flex flex-col items-center justify-center gap-2">
              <span class="text-3xl block">${opt.icon}</span>
              <span class="text-xs font-bold text-white block">${opt.text}</span>
            </div>
          `;
        });

        container.innerHTML = `
          <div class="animate-fadeIn text-center">
            <h2 class="text-xl font-black text-white mb-1">${step.question}</h2>
            <p class="text-xs text-slate-400 mb-6">${step.subtext || ''}</p>
            <div class="grid grid-cols-2 gap-3 mb-6">${opts}</div>
          </div>
        `;
      }
    }

    function selectOption(key, val) {
      answers[key] = val;
      nextStep();
    }

    function updateSlider(val) {
      answers.monthlyTarget = val;
      document.getElementById('sliderValDisplay').innerText = val;
    }

    function nextStep() {
      if (currentStepIndex < steps.length - 1) {
        currentStepIndex++;
        renderCurrentStep();
      }
    }

    function prevStep() {
      if (currentStepIndex > 0) {
        currentStepIndex--;
        renderCurrentStep();
      }
    }

    function startFunnelLoading() {
      currentStepIndex = 11; // Index of the loader
      renderCurrentStep();

      let progress = 13;
      const progressCircle = document.getElementById('progressCircle');
      const loadPercent = document.getElementById('loadPercent');
      const check2 = document.getElementById('stepCheck2');
      const check3 = document.getElementById('stepCheck3');

      const interval = setInterval(() => {
        progress += Math.floor(Math.random() * 18) + 12;
        if (progress > 100) progress = 100;

        loadPercent.innerText = progress + '%';
        const offset = 390 - (390 * progress) / 100;
        progressCircle.style.strokeDashoffset = offset;

        if (progress >= 50 && check2) {
          check2.className = 'flex items-center gap-2 text-amber-300';
          check2.innerHTML = '<span class="w-4 h-4 rounded-full bg-amber-400 text-black flex items-center justify-center text-[10px] font-bold">✓</span><span>نختار الصيغ الإعلانية الأكثر مبيعاً</span>';
        }
        if (progress >= 85 && check3) {
          check3.className = 'flex items-center gap-2 text-amber-300';
          check3.innerHTML = '<span class="w-4 h-4 rounded-full bg-amber-400 text-black flex items-center justify-center text-[10px] font-bold">✓</span><span>نجهّز الفيديوهات والنصوص التسويقية</span>';
        }

        if (progress >= 100) {
          clearInterval(interval);
          setTimeout(() => {
            currentStepIndex = 12; // Final deliverable
            renderCurrentStep();
          }, 600);
        }
      }, 450);
    }

    function openStudioCreator() {
      alert(`مبروك! تم تجهيز خطتك التسويقية لمجال (${answers.industry}) للوصول إلى (${answers.monthlyTarget} طلب شهرياً). يمكنك الآن إطلاق حملاتك فوراً.`);
    }

    // Initialize first step
    renderCurrentStep();
  </script>
</body>
